spring.application.name=ai-study-planner

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_study_planner?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.models=${GEMINI_MODELS:gemini-3.5-flash-lite,gemini-2.5-flash,gemini-flash-lite-latest}

roadmap.generation.timeout-seconds=${ROADMAP_TIMEOUT_SECONDS:120}
roadmap.resources.allowed-hosts=docs.python.org,pytorch.org,huggingface.co,ai.google.dev,developer.mozilla.org,spring.io,docs.oracle.com,scikit-learn.org,numpy.org,pandas.pydata.org,platform.openai.com,docs.trychroma.com

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
